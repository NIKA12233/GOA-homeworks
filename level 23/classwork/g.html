<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>style</title>
    <style>
        body {
            text-align: center;
        }
        h1 {
            color: blue;
            text-align: center;
        }
        button {
            background-color: lightblue;
            border: 2px solid darkblue;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: darkblue;
            color: white;
        }
    </style>
</head>
<body>
    <p style="color: red; font-size: 20px;">goal oriented academy</p>
    <h1>საიტის სათაური</h1>
    <button>join</button>
</body>
</html>
