    <h1>DIDGORI 1121</h1>
    <p>Battle of Didgori, August 12, 1121 - Georgian battle under the command of Davit IV Agmashenebeli against the Turkish-Selchuk coalition army in the Didgori Valley (near Manglisi, near Tbilisi). The Battle of Didgori is one of the greatest victories in the history of Georgia.
