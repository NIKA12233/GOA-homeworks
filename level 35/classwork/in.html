<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Divs</title>
    <style>
        .box {
            padding: 20px;
            margin: 10px;
            border-radius: 10px;
        }
        .box1 { background-color: lightblue; color: navy; font-size: 18px; }
        .box2 { background-color: lightcoral; color: white; font-size: 20px; }
        .box3 { background-color: lightgreen; color: darkgreen; font-size: 22px; }
        .box4 { background-color: lightpink; color: crimson; font-size: 24px; }
        .box5 { background-color: lightsalmon; color: brown; font-size: 26px; }
        .box6 { background-color: lightseagreen; color: teal; font-size: 28px; }
        .box7 { background-color: lightsteelblue; color: darkblue; font-size: 30px; }
        .box8 { background-color: lightyellow; color: darkgoldenrod; font-size: 32px; }
        .box9 { background-color: lavender; color: indigo; font-size: 34px; }
        .box10 { background-color: peachpuff; color: sienna; font-size: 36px; }
    </style>
</head>
<body>
    <div class="box box1"><h1>1</h1></div>
    <div class="box box2"><p>this is texs</p></div>
    <div class="box box3"><h2> title 2</h2></div>
    <div class="box box4"><ul><li> 1</li><li>2</li></ul></div>
    <div class="box box5"><h3> 3</h3></div>
    <div class="box box6"><ol><li>პ</li><i></li></ol></div>
    <div class="box box7"><h4> 4</h4></div>
    <div class="box box8"><p></p></div>
    <div class="box box9"><h5>სათაური 5</h5></div>
    
</body>
</html>
