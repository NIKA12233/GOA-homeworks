
<!DOCTYPE html>
<html lang="ka">
<head>

    <title>თემა:ფეხბურთი</title>

        body {

        header {
            background: #333;
            color: white;
            padding: 15px;
            width: 100%;

        }

            width: 100%;

        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-size: 18px;
        }
        .container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            margin: 20px;

        main {
            flex: 2;
            background: white;
            padding: 20px;
            margin-right: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

        aside {
            flex: 1;
            background: #eee;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {

            width: 100%;

    <footer>
        &copy; 2025 ფეხბურთის ბლოგი - ყველა უფლება დაცულია
